[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-learning-tool"
version = "0.8.0"
description = "以 LLM 为核心执行者的学习教练 Agent（状态机 + 结构化验收）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# 本地 RAG 知识库（本期不在 MVP 范围，按需安装）
rag = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "onnxruntime>=1.24",
    "tokenizers>=0.20",
    "huggingface-hub>=0.30",
    "qdrant-client>=1.12",
]

[project.scripts]
learning-coach = "coach.cli.main:main"

[tool.setuptools]
packages = ["coach", "coach.cli", "coach.domain", "coach.llm", "coach.orchestration", "coach.prompts", "coach.services", "coach.storage"]
